<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Eats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Addis Eats</h1>

        <input
            id="search"
            type="search"
            placeholder="Search dishes..."
        >
    </header>


    <!-- WELCOME SECTION -->
    <section class="welcome">

        <h2>Welcome to Addis Eats</h2>

        <p>
            Enjoy delicious Ethiopian food delivered to your door.
        </p>

    </section>


    <!-- CATEGORY MENU -->
    <nav class="categories" aria-label="Food categories">

        <button class="category-btn active" data-category="All">
            All
        </button>

        <button class="category-btn" data-category="Main">
            Main
        </button>

        <button class="category-btn" data-category="Vegetarian">
            Vegetarian
        </button>

        <button class="category-btn" data-category="Breakfast">
            Breakfast
        </button>

        <button class="category-btn" data-category="Side">
            Side
        </button>

    </nav>


    <!-- MAIN -->
    <main>

        <section class="menu-section">

            <h2>Our Menu</h2>

            <section id="menu"></section>

        </section>


        <!-- CART -->
        <aside id="cart" aria-label="Your order">

            <h2>Your order</h2>

            <p class="empty">
                Cart is empty
            </p>

        </aside>

        <label>Payment Method</label>

<select id="payment">
    <option value="telebirr">Telebirr</option>
    <option value="cash">Cash on Delivery</option>
</select>

<div id="telebirr-payment">
    <p>Pay with Telebirr</p>
    <p>Telebirr Number: 09xxxxxxxx</p>
    <p>Amount: <span id="payment-total">0</span> ETB</p>
</div>

    </main>


    <footer>
        <p>
            Bole, Addis Ababa · TeleBirr
        </p>
    </footer>


    <script src="./app.js"></script>

</body>

</html>
